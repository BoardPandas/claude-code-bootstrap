name: Scheduled security scan

# The /security-scan skill is on-demand, which makes coverage point-in-time: a
# dependency CVE published the day after a manual run goes unnoticed until
# somebody happens to run it again. This is the recurring half.
on:
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret deleted from the working tree is still leaked,
      # so the history is the part that actually matters here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # This repo ships no runtime dependencies, so a finding here means one was
      # added. Kept unconditional so that day is loud rather than silent.
      - name: Dependency audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=moderate
          else
            echo "No lockfile; nothing to audit. This repo ships zero dependencies by design."
          fi

      # Tracked credential material is the highest-severity finding in the
      # security-scan skill's own category list, and it is cheap to check for.
      - name: Tracked credential files
        run: |
          hits=$(git ls-files | grep -iE '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|keystore)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Tracked credential-shaped files found:"
            echo "$hits"
            exit 1
          fi
          echo "No tracked credential files."

      - name: Hook script syntax
        run: |
          status=0
          for f in .claude/scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; status=1; }
          done
          exit $status
