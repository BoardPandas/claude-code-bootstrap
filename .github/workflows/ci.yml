name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job here needs to write anything. Declaring it explicitly means a compromised
# action gets a read-only token rather than whatever the org default happens to be.
permissions:
  contents: read

jobs:
  claude-wiring:
    name: Claude wiring guard
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs: a tag is mutable, so
      # `@v4` re-points wherever the publisher (or an attacker who reaches the
      # repo) moves it. Comments record the human-readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # globSync is stable from Node 22.
          node-version: "22"

      # Deliberately BEFORE the guard itself: a green guard whose checks have been
      # narrowed to match nothing is indistinguishable from a clean repo, which is
      # the exact failure mode this repo exists to prevent. Verify the ruler, then
      # measure. Also covers the commit gate's refusal paths, which only ever run
      # when someone is being stopped -- so nothing else would exercise them.
      - name: Gate self-tests (wiring guard + commit gate)
        run: npm test

      # Runs before any install/build step so it fails fast. This repo has no
      # build, but keep the ordering when the template is cloned into one.
      # Also fails when the generated Codex mirror (AGENTS.md, .agents/skills/, .codex/)
      # no longer matches CLAUDE.md and .claude/ -- run `npm run sync:codex` to fix.
      - name: Claude wiring guard + Codex mirror drift
        run: npm run check:claude

      # Asserts .gitattributes still pins LF and that nothing is stored CRLF in the
      # index. A CRLF working tree plus a later LF-only rewrite by a tool that treats a
      # lone CR as a line terminator turns every CR into a REAL blank line, so a file's
      # line count becomes old-lines + old-CRs and roughly doubles each cycle. An index
      # went 257 -> 3071 lines that way while its content stayed at ~173, and a
      # one-number edit landed as a 768-insertion diff. Nothing looks wrong while it
      # happens: status is clean and Markdown renders N blank lines as one. This ships
      # as part of the template, so every repo cloned from it inherits the guard.
      - name: Line endings (LF pinned, no CRLF in the index)
        run: npm run check:eol

      # The hooks are shipped as part of the template, so a syntax error here
      # breaks every repo cloned from it.
      - name: Hook script syntax
        run: |
          status=0
          for f in .claude/scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; status=1; }
          done
          exit $status
